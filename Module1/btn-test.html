<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            container-type: inline-size;
        }

        button{
            background-color: black;
            color: white;
            font-size: 40px;
        }

        @container div(min-width: 500px){
            button{
                background-color: red;
                color: black;
                font-size: 20px;
            }
    }
    </style>
</head>
<body>
    <div>
    <button class="btn btn-primary">
        Hello World!
    </button>
    </div>
</body>
</html>
