<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 100%;
            height: 100vh;
            background-color: black;

        }
        p{
            font-family: Arial;
            font-size: 40px;
            font-weight: 900;

            text-align: center;

            letter-spacing: 3px;
            word-spacing: 15px;
            line-height: 100px;
        }                   
    </style>
</head>

    <div>
        <p>This is a paragraph This is a paragraph</p>
    </div>

</html>
