<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            grid-template:1fr 1fr 2fr;
        }
        .card {
            background-color: #f1f1f1;
            border: 1px solid #ccc;
        }
        </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h3>1</h3>
        </div>
        <div class="card">
            <h3>2</h3>
        </div>
        <div class="card">
            <h3>3</h3>
        </div>
    </div>
</body>
</html>
