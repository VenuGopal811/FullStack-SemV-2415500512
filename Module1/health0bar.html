<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .health-bar{
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background: black;
        }
        #H{
            display: flex;
            justify-content: space-between;
            align-items: center;}
        #Hlvl{
            color: rgb(87, 77, 77);
            text-align: left;
        }
        #Hnum{
            color: white;
            text-align: right;
        }
        </style>
</head>
<body>
    <div class="health-bar">
        <div id="H">
        <div id="Hlvl"><h4>Health LEVEL</h4></div>
        <div id="Hnum"><h3>9000+</h3></div>
        </div>
        <div style="width: 100%; 
            height: 20px; 
            background: linear-gradient(
                to right, 
                red, 
                yellow, 
                white); 
            border-radius: 10px;
            border: 1px solid black;    
            ">
            <!-- <div style="width: 80%; height: 100%; background-color: green;"></div> -->
        </div>
    </div>
</body>
</html>
