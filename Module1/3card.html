<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            flex-wrap: wrap;
            align-content: baseline;
            gap: 10px;
       }

       .card {
            border: 1px solid black;
            flex: 1;
            padding: 20px;
            display: flex;
            border-radius: 5px;
            box-shadow: 0 0 9px 0 grey;
            min-width: 100px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <img src="https://via.placeholder.com/100" alt="Profile Picture">
            <h2>John Doe</h2>
            <p>Web Developer</p>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/100" alt="Profile Picture">
            <h2>Jane Smith</h2>
            <p>Graphic Designer</p>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/100" alt="Profile Picture">
            <h2>Mike Johnson</h2>
            <p>Project Manager</p>
        </div>
    </div>
</body>
</html>
