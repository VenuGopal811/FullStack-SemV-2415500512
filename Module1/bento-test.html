<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container{
            display: grid;
            height:500px;
            width:500px;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            outline: 1px dashed grey;
        }

        .container>div{
            outline: 1px solid black;
            margin: 5px;
            border-radius: 5px;
        }

        #box1{
            grid-column-start: 1;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 3;
            background-color: red;
        }

        /* #box2{
            /* grid-area: box2; 
            background-color: blue;
        }
        #box3{
            /* grid-area: box3; 
            background-color: green;
        }
        #box4{
            /* grid-area: box4; 
            background-color: yellow;
        }
        #box5{
            /* grid-area: box5; 
            background-color: orange;
        }
        #box6{
            /* grid-area: box6; 
            background-color: purple;
        } */
    </style>
</head>
<body>
    <div class="container">
        <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
        <div id="box5">5</div>
        <div id="box6">6</div>
    </div>
</body>
</html>
