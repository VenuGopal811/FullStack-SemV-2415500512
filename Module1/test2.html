<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide Show</title>
    <style>
        .container{
            text-align: center;
            width: -webkit-fill-available;
        }
        .heading{
            text-align: center;
        }
        #title{
            
            position: fixed;
        }
        p{
            color: white;
        }
        .box{
            position:sticky;
            top: 50px;
            bottom:30px;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heading" id="title">
            <h1>Slide Show</h1>
        </div>    
        <div class="box" id="box1">
            <img src="https://picsum.photos/200" alt="Image 1">
            <p>Random thing 1</p></div>
        <div class="box" id="box2">
            <img src="https://picsum.photos/210" alt="Image 2">
            <p>Random thing 2</p></div>
        <div class="box" id="box3">
            <img src="https://picsum.photos/220" alt="Image 3">
            <p>Random thing 3</p></div>
        <div class="box" id="box4">
            <img src="https://picsum.photos/230" alt="Image 4">
            <p>Random thing 4</p></div>
        <div class="box" id="box5">
            <img src="https://picsum.photos/240" alt="Image 5">
            <p>Random thing 5</p></div>
    </div>
</body>
</html>
