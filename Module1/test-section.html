<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section h2{
            color:blue;
        }
        section>h2{
            color:green;
        }
        h2~p{
            color:purple;
            font-weight: 900;
        }
        h2+p{
            color:violet;
        }
    </style>
</head>
<body>
    <section>
        <h2>Typography</h2>
        <p>Para 1</p>
        <p>Para 2</p>
        <ul>
            <li>List 1</li>
            <li>List 2</li>
            <li>List 3</li>
        </ul>
        <div>
            <h2>Heading 2</h2>
        </div>
    </section>
</body>
</html>
