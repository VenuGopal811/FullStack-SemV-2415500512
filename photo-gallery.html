<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {

            padding: 0; */
            height: 500px;

            align-items: center;
            border: 1px solid black; /*afaf*/

        .container > div {
