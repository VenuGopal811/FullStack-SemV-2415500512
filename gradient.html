<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1, .box2, .box3{
            height: 300px;
            width: 300px;
        }
        .box1{
            background: repeating-linear-gradient(
    pink,
    pink 5px,
    white 5px,
    white 10px
  );
        }
        .box2{
            background: radial-gradient(ellipse, red, black);
        }
        .box3{
            background: conic-gradient(red, black);
        }
    </style>
</head>
<body>
    <p>Linear gradient</p>
    <div class="box1"></div>
    <p>Radial gradient</p>
    <div class="box2"></div>
    <p>Conic gradient</p>
    <div class="box3"></div>
</body>
</html>
