<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            height: 400px;
            width: 400px;
            /* background: linear-gradient(to right, red, yellow, white); */
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border: 5px solid black;
            border-radius: 10px;
            background: black;
            color: white;
        }
        .box2{
            height: 150px;
            width: 150px;
            background: conic-gradient(rgb(107, 107, 243), blue 240deg, white 10%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-radius: 50%;
            font-size: 10px;
        }
        .box3{
            display: flex;
            align-items: center;
            flex-direction: row;
            justify-content: space-between;
        }
        .box4{
            height: 80px;
            width: 80px;
            background: white;
            text-align: center;
            border-radius: 50%;
            color: black;
        }
        .box5{
            text-align: left;
        }
        .box6{
            text-align: right;
        }
        </style>
</head>
<body>
    <div class="box1">
        <div class="box2">
            <div class="box4">
            <h2>87%</h2>
            <h4>POWER</h4>
            </div>
        </div>
        <div class="box3">
            <div class="box5">
            <h4>Energy Output:</h4>
            </div>
            <div class="box6">
            <h4>8700/10000</h4>
            </div>
        </div>
    </div>
</body>
</html>
